<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive TODO List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="todo-app">
      <header>
        <p class="eyebrow">Week 4 assignment</p>
        <h1>Things to do</h1>
        <p>Add one task at a time and keep the list manageable.</p>
      </header>

      <form id="task-form" novalidate>
        <label for="task-input">New task</label>
        <div class="task-controls">
          <input id="task-input" name="task" type="text" autocomplete="off">
          <button type="submit">Add task</button>
        </div>
        <p id="task-error" class="error" role="alert"></p>
      </form>

      <section aria-labelledby="task-list-heading">
        <h2 id="task-list-heading">Your tasks</h2>
        <p id="empty-message">No tasks yet.</p>
        <ul id="task-list"></ul>
      </section>
    </main>
  </body>
</html>
