<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive TODO List</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header class="app-header">
      <div class="content">
        <h1>Today’s list</h1>
        <p class="task-summary">Open items / <span id="task-count" aria-live="polite">00</span></p>
      </div>
    </header>

    <div class="task-form-section">
      <form id="task-form" class="content">
        <label for="task-input">New task</label>
        <div class="task-entry">
          <input id="task-input" type="text" placeholder="Type a task..." autocomplete="off" />
          <button class="add-button" type="submit">Add</button>
        </div>
        <p id="task-error" role="alert"></p>
      </form>
    </div>

    <div class="paper">
      <ul id="task-list" class="content"></ul>
    </div>
  </main>
</body>
</html>
